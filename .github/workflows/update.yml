name: Update overlay data

permissions:
  contents: write

on:
  schedule:
    - cron: "0 * * * *"   # elk uur
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run data fetch
        run: python fetch_prices.py

      - name: Commit updated CSV
        run: |
          git config user.name "overlay-bot"
          git config user.email "overlay-bot@users.noreply.github.com"
          git add Overlay_Input.csv
          git commit -m "Update Overlay_Input.csv" || exit 0
          git push
